[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subscope"
version = "0.1.0"
description = "Passive subdomain discovery and domain inventory"
requires-python = ">=3.10"

[project.scripts]
subscope = "subscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
